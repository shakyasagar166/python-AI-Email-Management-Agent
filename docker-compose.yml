version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailmind_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./email_agent.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - LLM_PROVIDER=mock
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailmind_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
